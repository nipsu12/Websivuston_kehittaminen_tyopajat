<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    >
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <a class="navbar-brand" href="#">Navbar</a>
      <button
        class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item active">
            <a class="nav-link" href="#">Kotisivu</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Lisätietoja</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Yhteystiedot</a>
          </li>
        </ul>
      </div>
    </nav>
    <h1>06B WS Bootstrap</h1>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <div class="container text-center">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4">
        <div class="col">Tervetuloa!</div>
        <div class="col">Welcome!</div>
        <div class="col">Välkommen!</div>
        <div class="col">Willkommen!</div>
      </div>
    </div>
    <button class="btn btn-primary">Click Me</button>

    <div class="card" style="width: 18rem">
      <img
        src="images/IMG_8185Pieni.jpeg"
        class="card-img-top"
        alt="Card Image"
      >
      <div class="card-body">
        <h5 class="card-title">Kuva minusta</h5>
        <p class="card-text">Lempi vuodenaikani ovat syksy ja talvi.</p>
        <a href="#" class="btn btn-primary">Lisätietoa!</a>
      </div>
    </div>
    <div class="alert alert-info" role="alert">Huomio! Pidä ihana päivä!</div>
  </body>
</html>
